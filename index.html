
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10182d">
<title>معاينة سجل الامتحانات</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f6f9fc;color:#111a30;
 font-family:Tahoma,Arial,sans-serif
}
.top{
 background:#fff;padding:18px 14px;
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;box-shadow:0 2px 8px #15213a0a
}
.name{font-size:22px;font-weight:bold}
.city{color:#477b26;font-size:13px}
.balance{
 border:3px solid #a6e6d4;background:#e8f8f2;
 color:#00a77b;border-radius:35px;padding:15px 12px;
 font-size:18px;font-weight:bold;white-space:nowrap
}
.bell{
 border:3px solid #e3eaf3;border-radius:30px;
 padding:12px;font-size:24px
}
.nav{
 background:#10182d;color:#d9e1ef;
 display:flex;gap:10px;padding:18px 12px;
 overflow-x:auto;white-space:nowrap
}
.nav span{
 padding:15px 19px;border:1px solid #2a344b;
 border-radius:40px;font-size:18px;font-weight:bold
}
.nav .active{background:#283247;border-color:#3a475f}
main{padding:30px 18px}
h1{font-size:32px;line-height:1.5;margin:8px 0 14px}
.sub{font-size:20px;color:#687b96;font-weight:bold;margin-bottom:35px}
.banner{
 display:block;text-align:center;padding:23px 15px;
 border-radius:28px;color:#fff;text-decoration:none;
 font-size:20px;font-weight:bold;line-height:1.8;
 background:linear-gradient(115deg,#008344,#101b2c);
 box-shadow:0 12px 30px #10243b18
}
.card{
 margin-top:30px;border:1px solid #dfe7f0;
 border-radius:36px;overflow:hidden;background:white;
 box-shadow:0 12px 30px #10243b08
}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{
 padding:24px 8px;text-align:center;
 border-bottom:1px solid #dfe6ef;
 font-size:17px;line-height:1.9;overflow-wrap:anywhere
}
th{background:#f8fafc;font-size:17px;font-weight:bold}
th:nth-child(1){width:27%}
th:nth-child(2){width:30%}
th:nth-child(3){width:43%}
td input{
 width:66px;max-width:100%;padding:8px 3px;
 text-align:center;font-size:17px;border:1px solid #d7e0ec;
 border-radius:8px;background:#fff
}
.note{padding:14px;text-align:center;color:#6b7890;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button{
 border:0;border-radius:12px;padding:13px 16px;
 background:#172b4d;color:white;font-size:15px;font-weight:bold
}
button.secondary{background:#e5ebf3;color:#263753}
footer{text-align:center;color:#718096;padding:25px 10px;font-size:13px}
@media(min-width:600px){
 main{max-width:850px;margin:auto}
 h1{font-size:38px}
 th,td{padding:28px 14px;font-size:20px}
}
</style>
</head>
<body>
<div class="top">
 <div>
  <div class="name">مهند محمد عنتر</div>
  <div style="color:#687b96;margin-top:7px;font-weight:bold">
   سجل الامتحانات
  </div>
 </div>
 <div class="city">السعداوي</div>
 <div class="bell">🔔</div>
 <div class="balance">0 ج.م 💳</div>
</div>

<nav class="nav">
 <span>🏠 الرئيسية</span>
 <span>📅 سجل الحضور</span>
 <span class="active">📝 الامتحانات</span>
</nav>

<main>
 <h1>📝 سجل الامتحانات</h1>
 <div class="sub">درجات للامتحانات والواجبات</div>

 <div class="banner">💻 معاينة لسجل الامتحانات</div>

 <div class="card">
  <table>
   <thead>
    <tr>
     <th>التاريخ</th>
     <th>اسم التقييم</th>
     <th>الدرجة</th>
    </tr>
   </thead>
   <tbody id="rows"></tbody>
  </table>
  <div class="note">
   الدرجات علي المنصه تمثل مستوي الطالب
  </div>
 </div>

 <div class="actions">
  <button onclick="save()"> مع السعداوي هتبقي في الكيميا غاوي</button>
  <button class="secondary" onclick="resetDemo()"> اوعي تراكم</button>
 </div>
</main>

<footer>صفحة معاينة شخصية </footer>

<script>
const original=[
 {date:"2026-10-13",name:"امتحان حصة",grade:"لم يتم الرصد"},
 {date:"2026-10-10",name:"امتحان حصة",grade:"لم يتم الرصد"},
 {date:"2026-09-12",name:"امتحان شامل",grade:"لم يتم الرصد"}
];

let exams=original.map(x=>({...x}));

function render(){
 const rows=document.getElementById("rows");
 rows.replaceChildren();
 exams.forEach((exam,i)=>{
  const tr=document.createElement("tr");
  [exam.date,exam.name].forEach(value=>{
   const td=document.createElement("td");
   td.textContent=value;
   tr.appendChild(td);
  });
  const td=document.createElement("td");
  const input=document.createElement("input");
  input.value=exam.grade;
  input.setAttribute("aria-label","درجة  "+(i+1));
  input.addEventListener("input",()=>exams[i].grade=input.value);
  td.appendChild(input);
  tr.appendChild(td);
  rows.appendChild(tr);
 });
}

function save(){
 localStorage.setItem("demoExamPreview",JSON.stringify(exams));
 alert("اتحفظت التعديلات محليًا في المتصفح ده");
}
function resetDemo(){
 exams=original.map(x=>({...x}));
 localStorage.removeItem("demoExamPreview");
 render();
}
try{
 const saved=JSON.parse(localStorage.getItem("demoExamPreview"));
 if(Array.isArray(saved)&&saved.length===original.length)exams=saved;
}catch{}
render();
</script>
</body>
</html>
